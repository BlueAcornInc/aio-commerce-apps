# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]

  # Triggered by dependent repository releases. This path needs a PAT in the
  # source repo (DEPLOY_TRIGGER_TOKEN), so the nightly schedule below is the
  # credential-free backstop that keeps docs current if that token lapses.
  repository_dispatch:
    types: [release-trigger]

  # Rebuild nightly so docs changes in the manifest repos land without a push here
  schedule:
    - cron: "17 7 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # Every repo in the manifest is public, so the clones need no credentials.
      # This only rewrites the manifest's git@ URLs into anonymous HTTPS.
      - name: Configure Git for HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Build documentation
        run: make build-docs
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # Gate one: refuse to publish a build that has lost a URL somebody else
      # links to. This runs before the upload, so a regression cannot reach
      # production at all -- the previous deploy simply stays up.
      - name: Verify critical URLs exist in the build
        run: python3 bin/check-urls.py --site _site
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3
      # The Bulk Redirects list is generated from the same mapping as the stub
      # pages. Published as an artifact so it can be imported into Cloudflare
      # without re-running the build locally.
      - name: Upload Cloudflare redirect list
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-redirects
          path: cloudflare-redirects.csv
          if-no-files-found: warn

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Gate two: prove the URLs actually work on the real site. The build check
  # cannot see a bad Pages upload, a stale CDN edge, or a redirect rule, and
  # this is what the outside world -- Adobe's listing, an installed app --
  # actually hits. It also runs on the nightly schedule, so a URL that breaks
  # for reasons outside this repo still gets caught within a day.
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify critical URLs on production
        run: python3 bin/check-urls.py --host https://apps.blueacornici.shop
