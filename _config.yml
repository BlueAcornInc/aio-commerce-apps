title: Commerce Apps
description: Information and support for Blue Acorn Adobe Commerce Apps
theme: just-the-docs

# Required for absolute canonical URLs (see _includes/head_custom.html)
url: https://apps.blueacornici.shop

aux_links:
  Submit an Issue: https://github.com/BlueAcornInc/aio-commerce-apps/issues

# Jekyll configuration
exclude:
  - aio/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .git/
  - .gitignore
  - README.md
  - Makefile
  - bin/
  - build-docs.sh
  - manifest
  - redirects.yml
  - cloudflare-redirects.csv
include:
  - _img

# Ensure Jekyll copies the _img directory to _site
keep_files:
  - _img

