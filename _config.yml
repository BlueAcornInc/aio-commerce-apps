title: Commerce Apps
description: Information and support for Blue Acorn Adobe Commerce Apps
theme: just-the-docs
color_scheme: blueacorn

# No sidebar: each app has only a few pages, so navigation lives across the top
# instead (see _includes/header_custom.html) and the content gets the width.
nav_enabled: false

# Required for absolute canonical URLs (see _includes/head_custom.html)
url: https://apps.blueacornici.shop

# No aux_links: the header row is navigation, and "Submit an Issue" belongs with
# the other ways to reach us in the footer rather than competing with the app
# picker for attention.

# Jekyll configuration
exclude:
  - aio/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .git/
  - .gitignore
  - README.md
  - Makefile
  - bin/
  - build-docs.sh
  - manifest
  - redirects.yml
  - cloudflare-redirects.csv
include:
  - _img

# Ensure Jekyll copies the _img directory to _site
keep_files:
  - _img

