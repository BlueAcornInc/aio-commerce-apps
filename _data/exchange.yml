# Hand-maintained, unlike _data/repos.yml: a listing URL contains an Exchange
# app id that exists nowhere in the repo, so there is nothing to derive it from.
# Add an app here when its listing goes live; omitting one is fine, the
# resources strip just leaves the Exchange link out.
